name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race ./...
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Derive release metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-multiegg" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: VERSION=${{ env.VERSION }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign multi-arch image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Render pinned egg and checksums
        run: |
          jq --arg image "${IMAGE}:${VERSION}" --arg label "Smart MultiEgg ${VERSION}" '.docker_images = {($label): $image} | .exported_at = (now | todateiso8601)' egg/egg-smart-multiegg.json > "egg-smart-multiegg-${VERSION}.json"
          sha256sum "egg-smart-multiegg-${VERSION}.json" runtime-manifest.json > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            egg-smart-multiegg-${{ env.VERSION }}.json
            runtime-manifest.json
            SHA256SUMS
