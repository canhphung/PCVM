name: Upstream resolver smoke test

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -tags=live -run TestLiveResolvers -v ./internal/pcvm
      - name: Regenerate and validate runtime lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./cmd/runtime-manifest -out /tmp/runtime-manifest.json
          jq -e 'length == 27 and all(.[]; (.sha256 | length) == 64)' /tmp/runtime-manifest.json
          diff -u runtime-manifest.json /tmp/runtime-manifest.json
      - name: Validate Steam App IDs without downloading games
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6:i386 lib32gcc-s1
          url=$(jq -r '.[] | select(.kind == "steamcmd" and .architecture == "amd64") | .url' runtime-manifest.json)
          sha=$(jq -r '.[] | select(.kind == "steamcmd" and .architecture == "amd64") | .sha256' runtime-manifest.json)
          curl --fail --location --retry 3 "$url" -o /tmp/steamcmd.tar.gz
          echo "$sha  /tmp/steamcmd.tar.gz" | sha256sum --check
          mkdir /tmp/steamcmd
          tar -xzf /tmp/steamcmd.tar.gz -C /tmp/steamcmd
          /tmp/steamcmd/steamcmd.sh +login anonymous +app_info_update 1 +app_info_print 730 +app_info_print 4020 +app_info_print 222860 +app_info_print 2394010 +app_info_print 258550 +app_info_print 380870 +app_info_print 896660 +app_info_print 294420 +app_info_print 1110390 +app_info_print 1690800 +quit | tee /tmp/steam-apps.log
          for appid in 730 4020 222860 2394010 258550 380870 896660 294420 1110390 1690800; do
            grep -Fq "\"${appid}\"" /tmp/steam-apps.log
          done
      - name: Verify pinned Multi Theft Auto bundles
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request

          catalog = json.loads(pathlib.Path("internal/pcvm/catalog.json").read_text())
          provider = next(item for item in catalog["providers"] if item["id"] == "mtasa")
          options = provider["options"]
          for name in ("main", "base", "resources"):
              request = urllib.request.Request(options[f"{name}_url"], headers={"User-Agent": "PCVM nightly"})
              digest = hashlib.sha256()
              with urllib.request.urlopen(request, timeout=180) as response:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
              if digest.hexdigest() != options[f"{name}_sha256"]:
                  raise SystemExit(f"MTA {name} checksum changed upstream; refresh the pinned catalog")
          print("verified all pinned MTA bundles")
          PY
      - name: Verify immutable VM URLs and official checksum manifests
        run: |
          set -euo pipefail
          jq -r '.providers[].vm_images[]?.url' internal/pcvm/catalog.json | while IFS= read -r url; do
            curl --fail --silent --show-error --location --retry 3 --max-time 90 \
              --range 0-0 --max-filesize 1 --output /dev/null "$url"
          done
          python3 - <<'PY'
          import json, pathlib, re, urllib.parse, urllib.request

          catalog = json.loads(pathlib.Path("internal/pcvm/catalog.json").read_text())
          cache = {}
          for provider in catalog["providers"]:
              for image in provider.get("vm_images", []):
                  url = image["url"]
                  directory, filename = url.rsplit("/", 1)
                  algorithm = "sha512" if image.get("sha512") else "sha256"
                  manifest_name = "SHA512SUMS" if algorithm == "sha512" else "SHA256SUMS"
                  if "repo.almalinux.org" in url or "download.rockylinux.org" in url:
                      manifest_name = "CHECKSUM"
                  if "dl-cdn.alpinelinux.org" in url:
                      manifest_url = url + ".sha512"
                  else:
                      manifest_url = directory + "/" + manifest_name
                  if manifest_url not in cache:
                      request = urllib.request.Request(manifest_url, headers={"User-Agent": "PCVM nightly"})
                      with urllib.request.urlopen(request, timeout=90) as response:
                          cache[manifest_url] = response.read().decode("utf-8", "replace")
                  expected = image[algorithm].lower()
                  escaped = re.escape(urllib.parse.unquote(filename))
                  length = 128 if algorithm == "sha512" else 64
                  patterns = [
                      rf"(?mi)^([0-9a-f]{{{length}}})\s+[* ]?{escaped}\s*$",
                      rf"(?mi)^{algorithm.upper()}\s*\({escaped}\)\s*=\s*([0-9a-f]{{{length}}})\s*$",
                  ]
                  if "dl-cdn.alpinelinux.org" in url:
                      patterns.append(rf"(?mi)^([0-9a-f]{{{length}}})\s*$")
                  found = next((match.group(1).lower() for pattern in patterns if (match := re.search(pattern, cache[manifest_url]))), None)
                  if found != expected:
                      raise SystemExit(f"checksum manifest mismatch for {provider['id']} {image['version']} {image['architecture']}")
          print("verified 24 immutable VM image checksums")
          PY
