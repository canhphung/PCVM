name: Upstream resolver smoke test

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -tags=live -run TestLiveResolvers -v ./internal/multiegg
      - name: Regenerate and validate runtime lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./cmd/runtime-manifest -out /tmp/runtime-manifest.json
          jq -e 'length == 23 and all(.[]; (.sha256 | length) == 64)' /tmp/runtime-manifest.json
