name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - name: Validate generated assets
        run: |
          go run ./cmd/pcvm version
          jq -e '.meta.version == "PTDL_v2" and .startup == "/usr/local/bin/pcvm run"' egg/egg-pcvm.json
          jq -e 'length == 27 and all(.[]; (.sha256 | length) == 64)' runtime-manifest.json
          jq -e '.schema == 2 and .version == "1.3.0" and (.providers | length) == 35' internal/pcvm/catalog.json
          jq -e '.docker_images == {"PCVM 1.3.0":"ghcr.io/canhphung/pcvm:1.3.0"}' egg/egg-pcvm.json
      - name: Cross-compile launcher
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "pcvm-linux-$arch" ./cmd/pcvm
          done

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Derive image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pcvm" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-integration:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build architecture image
        run: docker buildx build --platform "linux/${ARCH}" --load --build-arg VERSION=1.3.0 -t "pcvm:web-${ARCH}" .
        env:
          ARCH: ${{ matrix.arch }}
      - name: Test static and reverse-proxy modes
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker network create pcvm-web
          docker run -d --name pcvm-upstream --network pcvm-web nginx:alpine
          cleanup() {
            docker rm -f pcvm-under-test pcvm-upstream >/dev/null 2>&1 || true
            docker network rm pcvm-web >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for provider in nginx apache caddy; do
            for mode in static proxy; do
              docker rm -f pcvm-under-test >/dev/null 2>&1 || true
              args=(--platform "linux/${ARCH}" -d --name pcvm-under-test --network pcvm-web -p 0:8080
                -e "SOFTWARE=${provider}" -e SERVER_PORT=8080 -e CLEAR_CONSOLE=0 -e "WEB_MODE=${mode}")
              if [ "$mode" = proxy ]; then
                args+=(-e UPSTREAM_URL=http://pcvm-upstream:80)
              fi
              docker run "${args[@]}" "pcvm:web-${ARCH}"
              ready=0
              for _ in $(seq 1 180); do
                if docker logs pcvm-under-test 2>&1 | grep -Fq '[PCVM] READY'; then
                  ready=1
                  break
                fi
                if ! docker inspect -f '{{.State.Running}}' pcvm-under-test | grep -q true; then
                  docker logs pcvm-under-test
                  exit 1
                fi
                sleep 1
              done
              test "$ready" = 1
              host_port=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' pcvm-under-test)
              curl --fail --retry 10 --retry-delay 1 "http://127.0.0.1:${host_port}/" >/dev/null
              docker stop --time 40 pcvm-under-test
            done
          done
