name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - name: Validate generated assets
        run: |
          go run ./cmd/pcvm version
          jq -e '.meta.version == "PTDL_v2" and .startup == "/usr/local/bin/pcvm run"' egg/egg-pcvm.json
          jq -e 'length == 27 and all(.[]; (.sha256 | length) == 64)' runtime-manifest.json
          jq -e '.schema == 5 and .version == "1.8.0" and (.providers | length) == 43 and all(.providers[]; (.memory.strategy | length) > 0 and .memory.recommended_mb > 0 and .memory.hard_minimum_mb >= 0) and ([.providers[].vm_images[]?] | length) == 24 and ([.providers[].vm_images[]? | select(.deprecated != true)] | length) == 20 and ([.providers[].vm_images[]? | select(.deprecated == true)] | length) == 4' internal/pcvm/catalog.json
          jq -e '.docker_images == {
            "PCVM 1.8.0 - Full (43 providers)":"ghcr.io/canhphung/pcvm:1.8.0",
            "PCVM 1.8.0 - Core (21 providers)":"ghcr.io/canhphung/pcvm:1.8.0-core",
            "PCVM 1.8.0 - Games (38 providers)":"ghcr.io/canhphung/pcvm:1.8.0-games",
            "PCVM 1.8.0 - Virtual Machines (26 providers)":"ghcr.io/canhphung/pcvm:1.8.0-vm"
          }' egg/egg-pcvm.json
          jq -e '.file_denylist == [".pcvm"]' egg/egg-pcvm.json
          jq -e '.features == ["eula"] and ([.variables[].env_variable] | index("ACCEPT_MINECRAFT_EULA") | not)' egg/egg-pcvm.json
      - name: Cross-compile launcher
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "pcvm-linux-$arch" ./cmd/pcvm
          done

  image:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [core, games, vm, full]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Derive image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pcvm" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.profile }}
            type=sha,suffix=-${{ matrix.profile }}
            type=ref,event=branch,enable=${{ matrix.profile == 'full' }}
            type=sha,enable=${{ matrix.profile == 'full' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=1.8.0
            PROFILE=${{ matrix.profile }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=profile-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=profile-${{ matrix.profile }}

  image-size:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Measure compressed GHCR layers by profile and architecture
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request

          repository = f"{os.environ['OWNER'].lower()}/pcvm"
          token_url = "https://ghcr.io/token?" + urllib.parse.urlencode({
              "service": "ghcr.io", "scope": f"repository:{repository}:pull",
          })
          credentials = base64.b64encode(f"{os.environ['ACTOR']}:{os.environ['GH_TOKEN']}".encode()).decode()
          token_request = urllib.request.Request(token_url, headers={"Authorization": f"Basic {credentials}"})
          with urllib.request.urlopen(token_request, timeout=30) as response:
              token = json.load(response)["token"]

          accept = ", ".join((
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ))

          def manifest(reference):
              request = urllib.request.Request(
                  f"https://ghcr.io/v2/{repository}/manifests/{reference}",
                  headers={"Authorization": f"Bearer {token}", "Accept": accept},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          sizes = {}
          for profile in ("core", "games", "vm", "full"):
              reference = f"main-{profile}"
              for attempt in range(6):
                  try:
                      index = manifest(reference)
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(5)
              for descriptor in index.get("manifests", []):
                  platform = descriptor.get("platform", {})
                  architecture = platform.get("architecture")
                  if platform.get("os") != "linux" or architecture not in ("amd64", "arm64"):
                      continue
                  image = manifest(descriptor["digest"])
                  sizes[(profile, architecture)] = sum(layer["size"] for layer in image.get("layers", []))

          for architecture in ("amd64", "arm64"):
              full = sizes[("full", architecture)]
              for profile in ("core", "games", "vm"):
                  candidate = sizes[(profile, architecture)]
                  if candidate >= full:
                      raise SystemExit(f"{profile}/{architecture} is not smaller than full")

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as output:
              output.write("### Compressed PCVM image layers\n\n")
              output.write("| Profile | AMD64 | ARM64 |\n|---|---:|---:|\n")
              for profile in ("core", "games", "vm", "full"):
                  amd64 = sizes[(profile, "amd64")] / 1024 / 1024
                  arm64 = sizes[(profile, "arm64")] / 1024 / 1024
                  output.write(f"| {profile} | {amd64:.2f} MiB | {arm64:.2f} MiB |\n")
          PY

  web-integration:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build architecture image
        run: docker buildx build --platform "linux/${ARCH}" --load --build-arg VERSION=1.8.0 --build-arg PROFILE=core -t "pcvm:web-${ARCH}" .
        env:
          ARCH: ${{ matrix.arch }}
      - name: Verify embedded core profile and package boundary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --platform "linux/${ARCH}" --entrypoint /usr/local/bin/pcvm "pcvm:web-${ARCH}" profile)" = core
          docker run --rm --platform "linux/${ARCH}" --entrypoint /bin/sh "pcvm:web-${ARCH}" -ec \
            'test ! -x /usr/bin/qemu-img; test ! -x /usr/bin/qemu-system-x86_64; test ! -x /usr/bin/qemu-system-aarch64; ! dpkg --print-foreign-architectures | grep -qx i386'
      - name: Test static mode and private-upstream rejection
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker network create pcvm-web
          docker run -d --name pcvm-upstream --network pcvm-web nginx:alpine
          cleanup() {
            docker rm -f pcvm-under-test pcvm-upstream >/dev/null 2>&1 || true
            docker network rm pcvm-web >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for provider in nginx apache caddy; do
            docker rm -f pcvm-under-test >/dev/null 2>&1 || true
            docker run --platform "linux/${ARCH}" -d --name pcvm-under-test --network pcvm-web -p 0:8080 \
              -e "SOFTWARE=${provider}" -e SERVER_PORT=8080 -e CLEAR_CONSOLE=0 -e WEB_MODE=static \
              "pcvm:web-${ARCH}"
            ready=0
            for _ in $(seq 1 180); do
              if docker logs pcvm-under-test 2>&1 | grep -Fq '[PCVM] READY'; then
                ready=1
                break
              fi
              if ! docker inspect -f '{{.State.Running}}' pcvm-under-test | grep -q true; then
                docker logs pcvm-under-test
                exit 1
              fi
              sleep 1
            done
            test "$ready" = 1
            host_port=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' pcvm-under-test)
            curl --fail --retry 10 --retry-delay 1 "http://127.0.0.1:${host_port}/" >/dev/null
            docker stop --time 40 pcvm-under-test

            docker rm -f pcvm-under-test >/dev/null 2>&1 || true
            docker run --platform "linux/${ARCH}" -d --name pcvm-under-test --network pcvm-web \
              -e "SOFTWARE=${provider}" -e SERVER_PORT=8080 -e CLEAR_CONSOLE=0 -e WEB_MODE=proxy \
              -e UPSTREAM_URL=http://pcvm-upstream:80 "pcvm:web-${ARCH}"
            for _ in $(seq 1 60); do
              if ! docker inspect -f '{{.State.Running}}' pcvm-under-test | grep -q true; then
                break
              fi
              sleep 1
            done
            test "$(docker inspect -f '{{.State.Running}}' pcvm-under-test)" = false
            docker logs pcvm-under-test 2>&1 | grep -Fq 'resolves to blocked address'
          done
      - name: Test cgroup memory budgets
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cleanup() { docker rm -f pcvm-memory-budget >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for limit in 512 96; do
            cleanup
            docker run --platform "linux/${ARCH}" -d --name pcvm-memory-budget \
              --memory "${limit}m" --memory-swap "${limit}m" \
              -e SOFTWARE=nginx -e SERVER_PORT=8080 -e CLEAR_CONSOLE=0 \
              "pcvm:web-${ARCH}"
            ready=0
            for _ in $(seq 1 120); do
              if docker logs pcvm-memory-budget 2>&1 | grep -Fq '[PCVM] READY'; then
                ready=1
                break
              fi
              if ! docker inspect -f '{{.State.Running}}' pcvm-memory-budget | grep -q true; then
                docker logs pcvm-memory-budget
                exit 1
              fi
              sleep 1
            done
            test "$ready" = 1
            docker logs pcvm-memory-budget 2>&1 | grep -Fq "[PCVM] MEMORY source=cgroup-v2 limit=${limit}MB target=${limit}MB reserve=0MB strategy=cgroup-only recommended=128MB"
            if [ "$limit" = 96 ]; then
              docker logs pcvm-memory-budget 2>&1 | grep -Fq 'below the recommended 128 MB'
            fi
            docker stop --time 40 pcvm-memory-budget
          done
      - name: Test cgroup OOM diagnostics
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cleanup() {
            docker rm -f pcvm-memory-oom >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          chmod 0777 "$work"
          cat >"$work/index.js" <<'JS'
          const blocks = [];
          setInterval(() => {
            for (let i = 0; i < 64; i++) blocks.push(Buffer.alloc(1024 * 1024, 1));
          }, 1);
          JS
          docker run -d --name pcvm-memory-oom --memory 384m --memory-swap 384m \
            --platform "linux/${ARCH}" \
            -v "$work:/home/container" \
            -e SOFTWARE=node-bot -e SOURCE_MODE=upload -e ENTRY_FILE=index.js \
            -e SERVER_PORT=8080 -e CLEAR_CONSOLE=0 "pcvm:web-${ARCH}"
          stopped=0
          for _ in $(seq 1 300); do
            if ! docker inspect -f '{{.State.Running}}' pcvm-memory-oom | grep -q true; then
              stopped=1
              break
            fi
            sleep 1
          done
          test "$stopped" = 1
          docker logs pcvm-memory-oom 2>&1 | grep -Fq 'strategy=node-heap'
          docker logs pcvm-memory-oom 2>&1 | grep -Fq 'OOM-killed by the container memory cgroup'
      - name: Build VM profile architecture image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker buildx build --platform "linux/${ARCH}" --load --build-arg VERSION=1.8.0 --build-arg PROFILE=vm -t "pcvm:vm-${ARCH}" .
      - name: Verify non-root VM profile, QEMU and firmware under Wings-like restrictions
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker run --rm --platform "linux/${ARCH}" --entrypoint /usr/local/bin/pcvm "pcvm:vm-${ARCH}" profile)" = vm
          if [ "$ARCH" = amd64 ]; then
            qemu=/usr/bin/qemu-system-x86_64
            firmware=/usr/share/OVMF/OVMF_CODE_4M.fd
          else
            qemu=/usr/bin/qemu-system-aarch64
            firmware=/usr/share/AAVMF/AAVMF_CODE.fd
          fi
          docker run --rm --platform "linux/${ARCH}" --read-only --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --cap-drop ALL --entrypoint /bin/sh "pcvm:vm-${ARCH}" -ec \
            "test \"\$(id -u)\" = 1000; ! dpkg --print-foreign-architectures | grep -qx i386; test -x '$qemu'; test -x /usr/bin/qemu-img; test -r '$firmware'; test ! -e /dev/kvm; '$qemu' --version; qemu-img --version; truncate -s 32M /tmp/source.raw; qemu-img convert -f raw -O qcow2 /tmp/source.raw /tmp/source.qcow2; qemu-img convert -f qcow2 -O qcow2 -c -o compat=1.1,compression_type=zstd /tmp/source.qcow2 /tmp/zstd.qcow2; qemu-img check -q /tmp/zstd.qcow2; qemu-img info --output=json /tmp/zstd.qcow2 | grep -Eq '\"compression-type\"[[:space:]]*:[[:space:]]*\"zstd\"'"
      - name: Verify AMD64 games profile boundary
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --build-arg VERSION=1.8.0 --build-arg PROFILE=games -t pcvm:games-amd64 .
          test "$(docker run --rm --entrypoint /usr/local/bin/pcvm pcvm:games-amd64 profile)" = games
          docker run --rm --entrypoint /bin/sh pcvm:games-amd64 -ec \
            'test ! -x /usr/bin/qemu-img; dpkg --print-foreign-architectures | grep -qx i386; test -e /lib/ld-linux.so.2 -o -e /lib/i386-linux-gnu/ld-linux.so.2'
      - name: Report profile virtual sizes
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### PCVM ${ARCH} profile virtual sizes"
            echo '| Profile | Bytes | MiB |'
            echo '|---|---:|---:|'
            for profile in core vm; do
              if [ "$profile" = core ]; then tag="pcvm:web-${ARCH}"; else tag="pcvm:vm-${ARCH}"; fi
              bytes=$(docker image inspect --format '{{.Size}}' "$tag")
              mib=$(awk -v size="$bytes" 'BEGIN { printf "%.2f", size/1024/1024 }')
              echo "| ${profile} | ${bytes} | ${mib} |"
            done
            if [ "$ARCH" = amd64 ]; then
              bytes=$(docker image inspect --format '{{.Size}}' pcvm:games-amd64)
              mib=$(awk -v size="$bytes" 'BEGIN { printf "%.2f", size/1024/1024 }')
              echo "| games | ${bytes} | ${mib} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
