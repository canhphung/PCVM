name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - name: Validate generated assets
        run: |
          go run ./cmd/pcvm version
          jq -e '.meta.version == "PTDL_v2" and .startup == "/usr/local/bin/pcvm run"' egg/egg-pcvm.json
          jq -e 'length == 27 and all(.[]; (.sha256 | length) == 64)' runtime-manifest.json
          jq -e '.schema == 4 and .version == "1.6.0" and (.providers | length) == 43 and ([.providers[].vm_images[]?] | length) == 24 and ([.providers[].vm_images[]? | select(.deprecated != true)] | length) == 20 and ([.providers[].vm_images[]? | select(.deprecated == true)] | length) == 4' internal/pcvm/catalog.json
          jq -e '.docker_images == {"PCVM 1.6.0":"ghcr.io/canhphung/pcvm:1.6.0"}' egg/egg-pcvm.json
          jq -e '.file_denylist == [".pcvm"]' egg/egg-pcvm.json
          jq -e '.features == ["eula"] and ([.variables[].env_variable] | index("ACCEPT_MINECRAFT_EULA") | not)' egg/egg-pcvm.json
      - name: Cross-compile launcher
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "pcvm-linux-$arch" ./cmd/pcvm
          done

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Derive image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pcvm" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-integration:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build architecture image
        run: docker buildx build --platform "linux/${ARCH}" --load --build-arg VERSION=1.6.0 -t "pcvm:web-${ARCH}" .
        env:
          ARCH: ${{ matrix.arch }}
      - name: Test static mode and private-upstream rejection
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker network create pcvm-web
          docker run -d --name pcvm-upstream --network pcvm-web nginx:alpine
          cleanup() {
            docker rm -f pcvm-under-test pcvm-upstream >/dev/null 2>&1 || true
            docker network rm pcvm-web >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for provider in nginx apache caddy; do
            docker rm -f pcvm-under-test >/dev/null 2>&1 || true
            docker run --platform "linux/${ARCH}" -d --name pcvm-under-test --network pcvm-web -p 0:8080 \
              -e "SOFTWARE=${provider}" -e SERVER_PORT=8080 -e CLEAR_CONSOLE=0 -e WEB_MODE=static \
              "pcvm:web-${ARCH}"
            ready=0
            for _ in $(seq 1 180); do
              if docker logs pcvm-under-test 2>&1 | grep -Fq '[PCVM] READY'; then
                ready=1
                break
              fi
              if ! docker inspect -f '{{.State.Running}}' pcvm-under-test | grep -q true; then
                docker logs pcvm-under-test
                exit 1
              fi
              sleep 1
            done
            test "$ready" = 1
            host_port=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' pcvm-under-test)
            curl --fail --retry 10 --retry-delay 1 "http://127.0.0.1:${host_port}/" >/dev/null
            docker stop --time 40 pcvm-under-test

            docker rm -f pcvm-under-test >/dev/null 2>&1 || true
            docker run --platform "linux/${ARCH}" -d --name pcvm-under-test --network pcvm-web \
              -e "SOFTWARE=${provider}" -e SERVER_PORT=8080 -e CLEAR_CONSOLE=0 -e WEB_MODE=proxy \
              -e UPSTREAM_URL=http://pcvm-upstream:80 "pcvm:web-${ARCH}"
            for _ in $(seq 1 60); do
              if ! docker inspect -f '{{.State.Running}}' pcvm-under-test | grep -q true; then
                break
              fi
              sleep 1
            done
            test "$(docker inspect -f '{{.State.Running}}' pcvm-under-test)" = false
            docker logs pcvm-under-test 2>&1 | grep -Fq 'resolves to blocked address'
          done
      - name: Verify non-root QEMU and firmware under Wings-like restrictions
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$ARCH" = amd64 ]; then
            qemu=/usr/bin/qemu-system-x86_64
            firmware=/usr/share/OVMF/OVMF_CODE_4M.fd
          else
            qemu=/usr/bin/qemu-system-aarch64
            firmware=/usr/share/AAVMF/AAVMF_CODE.fd
          fi
          docker run --rm --platform "linux/${ARCH}" --read-only --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --cap-drop ALL --entrypoint /bin/sh "pcvm:web-${ARCH}" -ec \
            "test \"\$(id -u)\" = 1000; test -x '$qemu'; test -x /usr/bin/qemu-img; test -r '$firmware'; test ! -e /dev/kvm; '$qemu' --version; qemu-img --version; truncate -s 32M /tmp/source.raw; qemu-img convert -f raw -O qcow2 /tmp/source.raw /tmp/source.qcow2; qemu-img convert -f qcow2 -O qcow2 -c -o compat=1.1,compression_type=zstd /tmp/source.qcow2 /tmp/zstd.qcow2; qemu-img check -q /tmp/zstd.qcow2; qemu-img info --output=json /tmp/zstd.qcow2 | grep -Eq '\"compression-type\"[[:space:]]*:[[:space:]]*\"zstd\"'"
