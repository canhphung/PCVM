name: Full VM smoke test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: VM provider ID
        required: true
        type: choice
        options: [vm-ubuntu, vm-debian, vm-almalinux, vm-rocky, vm-alpine]
      version:
        description: Distro version from the embedded catalog
        required: true
        type: string
      architecture:
        description: Native runner architecture
        required: true
        type: choice
        options: [amd64, arm64]

permissions:
  contents: read

jobs:
  boot:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate requested catalog combination
        env:
          PROVIDER: ${{ inputs.provider }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.architecture }}
        run: |
          jq -e --arg p "$PROVIDER" --arg v "$VERSION" --arg a "$ARCH" \
            '.providers[] | select(.id == $p) | .vm_images[] | select(.deprecated != true and .version == $v and .architecture == $a)' \
            internal/pcvm/catalog.json >/dev/null
      - name: Build native PCVM image
        run: docker build --build-arg "VERSION=$(jq -r .version internal/pcvm/catalog.json)" --build-arg PROFILE=vm -t pcvm:full-vm-smoke .
      - name: Boot, use serial console, reboot and power down
        env:
          PROVIDER: ${{ inputs.provider }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          disk_gb=8
          [ "$PROVIDER" != vm-alpine ] || disk_gb=2
          ready_attempts=300
          [ "$ARCH" != arm64 ] || ready_attempts=1200
          docker volume create pcvm-vm-smoke >/dev/null
          log_file=/tmp/pcvm-vm.log
          log_pid=
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ] && docker inspect pcvm-vm >/dev/null 2>&1; then
              echo '::group::VM container diagnostics'
              docker inspect pcvm-vm || true
              cat "$log_file" 2>/dev/null || docker logs pcvm-vm 2>&1 || true
              echo '::endgroup::'
            fi
            docker rm -f pcvm-vm >/dev/null 2>&1 || true
            if [ -n "$log_pid" ]; then
              kill "$log_pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 20); do
                kill -0 "$log_pid" >/dev/null 2>&1 || break
                sleep 0.1
              done
              kill -KILL "$log_pid" >/dev/null 2>&1 || true
            fi
            docker volume rm pcvm-vm-smoke >/dev/null 2>&1 || true
            return "$status"
          }
          trap cleanup EXIT
          docker run -d -i --name pcvm-vm --memory 3072m --cpus 2 --read-only \
            --security-opt no-new-privileges --cap-drop ALL --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            -v pcvm-vm-smoke:/home/container -e CLEAR_CONSOLE=0 -e SOFTWARE="$PROVIDER" \
            -e SOFTWARE_VERSION="$VERSION" -e SOFTWARE_BUILD=latest -e VM_DISK_GB="$disk_gb" \
            pcvm:full-vm-smoke >/dev/null
          docker logs --follow pcvm-vm > "$log_file" 2>&1 &
          log_pid=$!
          echo "[smoke] waiting up to ${ready_attempts}s for initial guest readiness"
          for _ in $(seq 1 "$ready_attempts"); do
            grep -Fq '[PCVM] READY' "$log_file" && break
            test "$(docker inspect -f '{{.State.Running}}' pcvm-vm)" = true
            sleep 1
          done
          test "$(grep -Fc '[PCVM] READY' "$log_file")" -ge 1
          echo '[smoke] guest ready; exercising the serial console'
          printf '%s\n' \
            'uname -m | sed "s/^/PCVM_ARCH=/"' \
            'sudo -n id -u | sed "s/^/PCVM_ROOT=/"' \
            'sudo -i -c "id -u" | sed "s/^/PCVM_LOGIN_ROOT=/"' \
            'sudo reboot' > /tmp/serial-input
          timeout --signal=TERM --kill-after=5s 20s \
            docker attach --sig-proxy=false pcvm-vm < /tmp/serial-input > /tmp/serial.log 2>&1 || true
          serial_ok=0
          for _ in $(seq 1 10); do
            if grep -Eq 'PCVM_ARCH=(x86_64|aarch64)' "$log_file" && \
              grep -Fq 'PCVM_ROOT=0' "$log_file" && grep -Fq 'PCVM_LOGIN_ROOT=0' "$log_file"; then
              serial_ok=1
              break
            fi
            sleep 1
          done
          test "$serial_ok" = 1
          echo "[smoke] waiting up to ${ready_attempts}s for readiness after guest reboot"
          for _ in $(seq 1 "$ready_attempts"); do
            test "$(grep -Fc '[PCVM] READY' "$log_file")" -ge 2 && break
            test "$(docker inspect -f '{{.State.Running}}' pcvm-vm)" = true
            sleep 1
          done
          test "$(grep -Fc '[PCVM] READY' "$log_file")" -ge 2
          timeout --signal=TERM --kill-after=5s 120s docker stop --time 110 pcvm-vm
          test "$(docker inspect -f '{{.State.Running}}' pcvm-vm)" = false
